ServiceAccount usage
To grant ServiceAccounts appropriate permissions, you must define RBAC rules. For
agent security, you should use use-case-specific custom API groups and resources
rather than standard Kubernetes resources.
Here is the critical distinction: protecting access to the Kubernetes Service resource
does not protect access to the service’s endpoints. A ServiceAccount with get permis‐
sions on a service can only read the service metadata, not call the actual service.
Instead, define application-specific resources that represent application-level permis‐
sions.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: customer-support-mcp
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: data-platform
  name: customer-data-reader
rules:
  - apiGroups: ["agents.example.com"]
    resources: ["customer-queries"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: customer-support-mcp-binding
  namespace: data-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: customer-data-reader
subjects:
  - kind: ServiceAccount
    name: customer-support-mcp
    namespace: agents
